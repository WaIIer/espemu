name: Release packages
on:
  # Runs only once a pull request is merged, on the merged commit; dispatch builds without publishing.
  pull_request_target:
    types: [closed]
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-packages-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.pull_request.merged }}
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    permissions:
      contents: read
    env:
      VERSION: 0.1.${{ github.run_number }}
      OUT: ${{ github.workspace }}/packages
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
          persist-credentials: false
      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Build the install tree in the pinned Ubuntu 24.04 image
        run: |
          mkdir -p "$RUNNER_TEMP/tree"
          bash packaging/build-in-container.sh "$RUNNER_TEMP/tree" "$VERSION" "$OUT"
      - name: Build the Ubuntu and Arch packages
        run: |
          bash packaging/build-deb.sh "$RUNNER_TEMP/tree" "$VERSION" "$OUT"
          bash packaging/build-arch.sh "$RUNNER_TEMP/tree" "$VERSION" "$OUT"
          rm -rf "$RUNNER_TEMP/tree"
          cd "$OUT" && sha256sum espemu* > SHA256SUMS && cat SHA256SUMS && ls -l && df -h /
      - name: Install, build and run firmware offline on Ubuntu 24.04
        run: bash packaging/test-install.sh ubuntu "$OUT"
      - name: Install, build and run firmware offline on Arch Linux
        run: bash packaging/test-install.sh arch "$OUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: packages
          path: packages/
          retention-days: 3
          compression-level: 0
  publish:
    needs: build
    if: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.merged }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: release
    permissions:
      contents: write
    env:
      VERSION: 0.1.${{ github.run_number }}
      RELEASE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: packages
          path: packages
      - name: Publish the prerelease and move latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash packaging/publish.sh "$VERSION" packages
