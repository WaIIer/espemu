services:
  workbench:
    build:
      context: .
      target: runtime
    ports:
      - "127.0.0.1:${PORT:-4000}:4000"
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=128m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 10s
    mem_limit: 512m
  verification:
    profiles:
      - test
    build:
      context: .
      target: verification
    init: true
    environment:
      CI: "true"
      SOAK: "1"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
